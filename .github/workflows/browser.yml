name: Browser

# Called by ci.yml and publish.yml: the same proof gates a pull request and a release.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  browser:
    name: Sample form in Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm

      # Dependency lifecycle scripts are an arbitrary-code-execution path during install.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      # The one browser the test needs, with its system libraries.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Builds the sample page against the sources and drives it: errors, focus, keyboard, both
      # themes, React 18 and 19.
      - name: Browser test
        run: npm run test:browser

      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: browser-screenshots
          path: e2e/out/
          if-no-files-found: ignore
